name: Verify and deploy to IPFS
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run notices:check
      - run: bun run lint && bun run test && bun run build
      - name: Compile local launcher
        run: |
          bun build cli/main.ts --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --no-compile-autoload-tsconfig --no-compile-autoload-package-json --target=bun-linux-x64 --outfile release/freelp-linux-x64
          bun build cli/main.ts --compile --no-compile-autoload-dotenv --no-compile-autoload-bunfig --no-compile-autoload-tsconfig --no-compile-autoload-package-json --target=bun-darwin-arm64 --outfile release/freelp-darwin-arm64
      - name: Verify launcher bootstrap isolation
        run: bun scripts/check-launcher.ts release/freelp-linux-x64
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Browser contract lifecycle
        run: |
          bunx playwright install --with-deps chromium
          anvil --port 18545 --hardfork osaka --silent > /tmp/freelp-anvil.log 2>&1 &
          bun run test:e2e
      - name: Package content-addressed site
        run: bun scripts/package-release.ts
      - name: Private provenance (no public transparency log)
        if: github.event.repository.private
        run: bun scripts/private-proof.ts
      - name: Public provenance
        if: '!github.event.repository.private'
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            release/descriptor.json
            release/freelp-linux-x64
            release/freelp-darwin-arm64
      - name: Preserve public verification bundle
        if: '!github.event.repository.private'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/provenance.json
      - name: Package site with verification proof
        run: bun scripts/package-proof.ts
      - name: Verify release through an isolated IPFS gateway
        env:
          PRIVATE_BUILD: ${{ github.event.repository.private }}
          IPFS_PATH: ${{ github.workspace }}/.cache/ipfs
        run: |
          bash scripts/install-ipfs.sh
          bash scripts/pin-release.sh
          .cache/bin/ipfs config Addresses.API /ip4/127.0.0.1/tcp/5001
          .cache/bin/ipfs config Addresses.Gateway /ip4/127.0.0.1/tcp/8080
          .cache/bin/ipfs daemon --offline > /tmp/freelp-ipfs.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then
            cat /tmp/freelp-ipfs.log
            exit 1
          fi
          release_cid=$(bun -e 'console.log((await Bun.file("release/deployment.json").json()).releaseCid)')
          options=()
          if [[ "$PRIVATE_BUILD" == true ]]; then options+=(--private-build); fi
          release/freelp-linux-x64 --cid "$release_cid" --gateway http://127.0.0.1:8080 "${options[@]}" --verify-only
          bun scripts/check-gateway.ts "$release_cid"
      - name: Import and pin IPFS deployment
        env:
          FREELP_PUBLIC_RELEASE: ${{ !github.event.repository.private }}
          FREELP_PIN_API: ${{ secrets.FREELP_PIN_API }}
        run: bash scripts/pin-release.sh
      - name: Retain deployment artifacts privately before launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file docs/release-notes.md release/*
          else
            tag="build-$GITHUB_SHA"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Build $GITHUB_SHA" --notes-file docs/release-notes.md release/*
          fi
