name: Verify and deploy to IPFS
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run notices:check
      - run: bun run lint && bun run test && bun run build
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Browser contract lifecycle
        run: |
          bunx playwright install --with-deps chromium
          anvil --port 18545 --hardfork osaka --silent > /tmp/freelp-anvil.log 2>&1 &
          bun run test:e2e
          bun run preview --port 14177 > /tmp/freelp-preview.log 2>&1 &
          bun scripts/ux-audit.ts http://127.0.0.1:14177/ .cache/ux-audit
          bun scripts/lighthouse.ts http://127.0.0.1:14177/ .cache/ux-audit
      - name: Package content-addressed site
        run: |
          bun scripts/package-release.ts
          cp .cache/ux-audit/accessibility.json .cache/ux-audit/lighthouse-*.json release/
      - name: Pack npm distribution (no publication)
        run: npm pack --ignore-scripts --pack-destination release
      - name: Exercise packaged application
        run: bun scripts/check-package.ts release/ekubo-freelp-*.tgz
      - name: Verify release through an isolated IPFS gateway
        env:
          PRIVATE_BUILD: ${{ github.event.repository.private }}
          IPFS_PATH: ${{ github.workspace }}/.cache/ipfs
        run: |
          bash scripts/install-ipfs.sh
          bash scripts/pin-release.sh
          .cache/bin/ipfs config Addresses.API /ip4/127.0.0.1/tcp/5001
          .cache/bin/ipfs config Addresses.Gateway /ip4/127.0.0.1/tcp/8080
          .cache/bin/ipfs daemon --offline > /tmp/freelp-ipfs.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then
            cat /tmp/freelp-ipfs.log
            exit 1
          fi
          site_cid=$(bun -e 'console.log((await Bun.file("release/deployment.json").json()).siteCid)')
          bun scripts/check-gateway.ts "$site_cid"
      - name: Seed public IPFS deployment from CI
        if: "!github.event.repository.private && vars.FREELP_PUBLIC_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/v')"
        env:
          FREELP_PUBLIC_RELEASE: "true"
        run: bash scripts/seed-release.sh
      - name: Retain deployment artifacts privately before launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file docs/release-notes.md release/*
          else
            tag="build-$GITHUB_SHA"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "Build $GITHUB_SHA" --notes-file docs/release-notes.md release/*
          fi
