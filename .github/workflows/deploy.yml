name: Verify and deploy to IPFS
on:
  push:
    branches: ['**']
    tags: ['**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run notices:check
      - run: bun run lint && bun run test && bun run build
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Browser contract lifecycle
        run: |
          bunx playwright install --with-deps chromium
          anvil --port 18545 --hardfork osaka --silent > /tmp/freelp-anvil.log 2>&1 &
          bun run test:e2e
          bun run preview --port 14177 > /tmp/freelp-preview.log 2>&1 &
          bun scripts/ux-audit.ts http://127.0.0.1:14177/ .cache/ux-audit
          bun scripts/lighthouse.ts http://127.0.0.1:14177/ .cache/ux-audit
      - name: Package content-addressed site
        run: |
          bun scripts/package-release.ts
      - name: Pack npm distribution (no publication)
        run: npm pack --ignore-scripts --pack-destination release
      - name: Exercise packaged application
        run: bun scripts/check-package.ts release/ekubo-freelp-*.tgz
      - name: Verify release through an isolated IPFS gateway
        env:
          PRIVATE_BUILD: ${{ github.event.repository.private }}
          IPFS_PATH: ${{ github.workspace }}/.cache/ipfs
        run: |
          bash scripts/install-ipfs.sh
          bash scripts/pin-release.sh
          .cache/bin/ipfs config Addresses.API /ip4/127.0.0.1/tcp/5001
          .cache/bin/ipfs config Addresses.Gateway /ip4/127.0.0.1/tcp/8080
          .cache/bin/ipfs daemon --offline > /tmp/freelp-ipfs.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:5001/api/v0/version -X POST > /dev/null; then
            cat /tmp/freelp-ipfs.log
            exit 1
          fi
          site_cid=$(bun -e 'console.log((await Bun.file("release/deployment.json").json()).siteCid)')
          bun scripts/check-gateway.ts "$site_cid"
      - name: Pin build on the persistent IPFS node
        env:
          FREELP_PIN_HOST: ${{ vars.FREELP_PIN_HOST }}
          FREELP_PIN_SSH_KEY: ${{ secrets.FREELP_PIN_SSH_KEY }}
          FREELP_PIN_HOST_KEY: ${{ secrets.FREELP_PIN_HOST_KEY }}
        run: bash scripts/retain-release.sh release
      - name: Link the IPFS preview to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/link-build.ts
      - name: Retain verified build for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release
          path: |
            release/ekubo-freelp-*.tgz
            release/site.car
            release/deployment.json
          if-no-files-found: error
          retention-days: 90
      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/release-notes.md

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.FREELP_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-release
          path: release
      - name: Validate release identity and launch readiness
        shell: bash
        run: |
          packages=(release/ekubo-freelp-*.tgz)
          test "${#packages[@]}" -eq 1
          tar -xOf "${packages[0]}" package/package.json > manifest.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('manifest.json', 'utf8'));
          if (p.name !== '@ekubo/freelp' || typeof p.version !== 'string' || p.private === true || p.repository?.url !== 'git+https://github.com/EkuboProtocol/freelp.git') {
            throw new Error('Package name, version, repository or launch readiness does not match this release.');
          }
          JS
      - name: Publish using npm trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: npm publish release/ekubo-freelp-*.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org/ --tag latest
